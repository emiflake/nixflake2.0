# Fix Neovim escape delay
set-option -sg escape-time 10

# Enable focus events for autoread to work properly
set-option -g focus-events on

# True color support
set-option -g default-terminal "screen-256color"
set-option -sa terminal-features ',xterm-256color:RGB'

# Mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Better splitting with current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Quick pane switching with C-b C-b (cycle through panes)
bind C-b select-pane -t :.+

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Increase scrollback buffer
set-option -g history-limit 10000

# Minimal monochrome theme
set-option -g status-style bg=black,fg=white
set-option -g status-left ""
set-option -g status-right "#[fg=white]#S "

# Window status
set-window-option -g window-status-style fg=colour8,bg=black
set-window-option -g window-status-current-style fg=white,bg=black,bold

# Pane borders
set-option -g pane-border-style fg=colour8
set-option -g pane-active-border-style fg=white

# Message text
set-option -g message-style bg=black,fg=white

# Clock mode
set-window-option -g clock-mode-colour white
